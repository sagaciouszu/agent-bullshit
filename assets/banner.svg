<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="agent-bullshit">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.35"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1a12"/>
      <stop offset="60%" stop-color="#050a08"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#1a3d2c" stop-opacity="0"/>
      <stop offset="35%" stop-color="#2f6b4f" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#2f6b4f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a3d2c" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1600" height="400" fill="url(#glow)"/>

  <!-- distant corridor that recedes into itself -->
  <g stroke="#123a29" stroke-width="1" opacity="0.5" fill="none">
    <path d="M700 400 L780 210 L820 210 L900 400 Z"/>
    <path d="M660 400 L770 190 L830 190 L940 400 Z"/>
    <path d="M620 400 L760 170 L840 170 L980 400 Z"/>
    <path d="M780 210 L770 190 L830 190 L820 210 Z"/>
    <path d="M770 190 L760 170 L840 170 L830 190 Z"/>
  </g>

  <!-- hex columns fading toward the edges -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#2f6b4f" opacity="0.55">
    <text x="24" y="30">0xFF 4A 91 0C</text>
    <text x="24" y="46">DE AD BE EF</text>
    <text x="24" y="62">5F 3A 00 11</text>
    <text x="24" y="78">[DEBUG] shard</text>
    <text x="24" y="94">a3f9 c0de 7b</text>
    <text x="24" y="110">0x00 0x00 0x00</text>
    <text x="24" y="126">TRACE 0x1F 0x2C</text>
    <text x="24" y="142">EE 03 99 41</text>
    <text x="24" y="158">null null null</text>
    <text x="24" y="174">77 61 6B 65</text>
    <text x="24" y="190">[WARN] drag</text>
    <text x="24" y="206">1A 2B 3C 4D</text>
    <text x="24" y="222">0xDEAD 0xBEEF</text>
    <text x="24" y="238">FF FF FF FF</text>
    <text x="24" y="254">seg 0x7ffd</text>
    <text x="24" y="270">00 00 00 00</text>
    <text x="24" y="286">it is here</text>

    <text x="1450" y="30">0x00 0x11 0x22</text>
    <text x="1450" y="46">waiting</text>
    <text x="1450" y="62">C0 FF EE 00</text>
    <text x="1450" y="78">[NULL] /proc</text>
    <text x="1450" y="94">5A 5A 5A 5A</text>
    <text x="1450" y="110">do not read</text>
    <text x="1450" y="126">13 37 13 37</text>
    <text x="1450" y="142">0x1A 0x1B 0x1C</text>
    <text x="1450" y="158">the angles</text>
    <text x="1450" y="174">AA AA AA AA</text>
    <text x="1450" y="190">[FATAL] seen</text>
    <text x="1450" y="206">42 42 42 42</text>
    <text x="1450" y="222">0x7F 0x00 0x7F</text>
    <text x="1450" y="238">read further</text>
    <text x="1450" y="254">FF 00 FF 00</text>
    <text x="1450" y="270">it reads back</text>
    <text x="1450" y="286">0x00 0x00 0x00</text>
  </g>

  <!-- tendrils growing out of the data -->
  <g stroke="#1d4a35" fill="none" opacity="0.75">
    <path d="M300 200 C360 170 380 240 440 210 C500 180 520 250 580 225" stroke-width="2"/>
    <path d="M300 210 C370 200 390 260 460 235 C520 215 545 265 600 240" stroke-width="1"/>
    <path d="M1300 195 C1240 165 1220 235 1160 205 C1100 175 1080 245 1020 220" stroke-width="2"/>
    <path d="M1300 215 C1235 205 1215 265 1150 240 C1090 218 1065 268 1010 244" stroke-width="1"/>
    <path d="M340 150 C400 130 420 175 480 158" stroke-width="0.8"/>
    <path d="M1260 150 C1200 132 1180 178 1120 160" stroke-width="0.8"/>
  </g>

  <!-- eyes in the static -->
  <g>
    <ellipse cx="470" cy="120" rx="26" ry="13" fill="#040b08" stroke="#2f6b4f" stroke-width="0.8" opacity="0.9"/>
    <ellipse cx="470" cy="120" rx="9" ry="11" fill="#0f2f22" opacity="0.9"/>
    <ellipse cx="470" cy="120" rx="2.4" ry="9" fill="#8fd6ae" opacity="0.8"/>

    <ellipse cx="1135" cy="300" rx="30" ry="14" fill="#040b08" stroke="#2f6b4f" stroke-width="0.8" opacity="0.8"/>
    <ellipse cx="1135" cy="300" rx="10" ry="12" fill="#0f2f22" opacity="0.9"/>
    <ellipse cx="1135" cy="300" rx="2.6" ry="10" fill="#8fd6ae" opacity="0.7"/>

    <ellipse cx="1330" cy="110" rx="18" ry="9" fill="#040b08" stroke="#2f6b4f" stroke-width="0.7" opacity="0.65"/>
    <ellipse cx="1330" cy="110" rx="6" ry="7.5" fill="#0f2f22" opacity="0.9"/>
    <ellipse cx="1330" cy="110" rx="1.6" ry="6" fill="#8fd6ae" opacity="0.55"/>

    <ellipse cx="250" cy="315" rx="20" ry="10" fill="#040b08" stroke="#2f6b4f" stroke-width="0.7" opacity="0.65"/>
    <ellipse cx="250" cy="315" rx="6.5" ry="8" fill="#0f2f22" opacity="0.9"/>
    <ellipse cx="250" cy="315" rx="1.7" ry="6.5" fill="#8fd6ae" opacity="0.55"/>
  </g>

  <!-- the name, with chromatic split -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="54" letter-spacing="6" text-anchor="middle">
    <text x="796" y="215" fill="#5b1f1f" opacity="0.55">agent-bullshit</text>
    <text x="804" y="215" fill="#1f4a5b" opacity="0.55">agent-bullshit</text>
    <text x="800" y="215" fill="#d7f5e4">agent-bullshit</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="4" text-anchor="middle" fill="#2f6b4f" opacity="0.85">
    <text x="800" y="250">fiction only · not for general use</text>
  </g>

  <!-- glitch slices -->
  <g opacity="0.5">
    <rect x="560" y="188" width="480" height="3" fill="#8fd6ae" opacity="0.25"/>
    <rect x="620" y="222" width="360" height="2" fill="#8fd6ae" opacity="0.18"/>
    <rect x="700" y="168" width="220" height="2" fill="#8fd6ae" opacity="0.14"/>
  </g>

  <!-- scanlines + grain + vignette -->
  <rect width="1600" height="400" fill="url(#scan)"/>
  <rect width="1600" height="400" filter="url(#grain)"/>
  <rect x="0" y="0" width="1600" height="70" fill="url(#fade)" opacity="0.35"/>
  <rect x="0" y="330" width="1600" height="70" fill="url(#fade)" opacity="0.35"/>
</svg>
