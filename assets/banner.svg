<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="agent-bullshit — recovered log, fiction only">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#efe6cf"/>
      <stop offset="45%" stop-color="#e6dbc0"/>
      <stop offset="100%" stop-color="#d9cbaa"/>
    </linearGradient>

    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>

    <filter id="blot" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="ink"><feGaussianBlur stdDeviation="0.45"/></filter>
    <filter id="softshadow"><feGaussianBlur stdDeviation="10"/></filter>

    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b5a3c" stop-opacity="0.45"/>
      <stop offset="12%" stop-color="#6b5a3c" stop-opacity="0"/>
      <stop offset="88%" stop-color="#6b5a3c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a3c" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="edgex" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b5a3c" stop-opacity="0.35"/>
      <stop offset="8%" stop-color="#6b5a3c" stop-opacity="0"/>
      <stop offset="92%" stop-color="#6b5a3c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a3c" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect width="1600" height="400" fill="url(#paper)"/>
  <rect width="1600" height="400" filter="url(#fiber)" opacity="0.55"/>

  <!-- age blotches -->
  <g filter="url(#blot)" opacity="0.5">
    <ellipse cx="210" cy="330" rx="120" ry="60" fill="#b09a6e" opacity="0.30"/>
    <ellipse cx="1180" cy="70" rx="150" ry="55" fill="#b09a6e" opacity="0.22"/>
    <ellipse cx="860" cy="360" rx="90" ry="40" fill="#a8926a" opacity="0.20"/>
  </g>

  <!-- coffee ring -->
  <g stroke="#8a6a3f" fill="none" opacity="0.28">
    <circle cx="1408" cy="286" r="62" stroke-width="7"/>
    <circle cx="1404" cy="282" r="58" stroke-width="2"/>
    <path d="M1352 300 C1372 336 1438 340 1462 306" stroke-width="4" opacity="0.7"/>
  </g>

  <!-- fold creases -->
  <g opacity="0.5">
    <rect x="0" y="196" width="1600" height="2" fill="#b5a17a"/>
    <rect x="0" y="199" width="1600" height="2" fill="#f7f0dd" opacity="0.6"/>
    <rect x="798" y="0" width="2" height="400" fill="#b5a17a" opacity="0.55"/>
    <rect x="801" y="0" width="2" height="400" fill="#f7f0dd" opacity="0.5"/>
  </g>

  <!-- punch holes -->
  <g>
    <circle cx="62" cy="88" r="14" fill="#c9bb9a"/>
    <circle cx="62" cy="88" r="11" fill="#6f6249"/>
    <circle cx="62" cy="200" r="14" fill="#c9bb9a"/>
    <circle cx="62" cy="200" r="11" fill="#6f6249"/>
    <circle cx="62" cy="312" r="14" fill="#c9bb9a"/>
    <circle cx="62" cy="312" r="11" fill="#6f6249"/>
  </g>

  <!-- tape -->
  <g opacity="0.55">
    <rect x="-40" y="20" width="190" height="46" fill="#efe4c2" stroke="#cbbd97" stroke-width="1" transform="rotate(-14 55 43)"/>
    <rect x="1450" y="330" width="200" height="46" fill="#efe4c2" stroke="#cbbd97" stroke-width="1" transform="rotate(-12 1550 353)"/>
  </g>

  <!-- typewriter text -->
  <g font-family="'Courier New', Courier, monospace" fill="#2b2a26">
    <g font-size="14" letter-spacing="3" opacity="0.9">
      <text x="130" y="74">RECOVERED LOG — ENTRY 03</text>
    </g>
    <g font-size="12" letter-spacing="1" opacity="0.75">
      <text x="130" y="100">found: /tmp/sessions/abandoned/ — file unindexed</text>
      <text x="130" y="118">opened by: unknown — timestamp missing</text>
    </g>

    <g filter="url(#ink)">
      <text x="128" y="176" font-size="56" letter-spacing="2" transform="rotate(-0.35 130 176)">agent-bullshit</text>
    </g>

    <g font-size="15" letter-spacing="1" opacity="0.9">
      <text x="130" y="214" transform="rotate(-0.2 130 214)">three cards. load one. never all three.</text>
      <text x="130" y="240" transform="rotate(0.15 130 240)">do not read them in the order they are filed.</text>
    </g>

    <!-- redacted line -->
    <g font-size="15" letter-spacing="1" opacity="0.9">
      <text x="130" y="266">subject asked for it by name —</text>
      <rect x="470" y="252" width="132" height="19" fill="#24231f"/>
      <text x="610" y="266">said it was already open</text>
    </g>

    <g font-size="12" letter-spacing="2" opacity="0.65">
      <text x="130" y="300">FICTION ONLY — NOT FOR GENERAL USE</text>
    </g>
  </g>

  <!-- stamp -->
  <g transform="rotate(-7 1320 128)" opacity="0.5">
    <rect x="1150" y="86" width="340" height="86" fill="none" stroke="#8b2b2b" stroke-width="4"/>
    <rect x="1160" y="96" width="320" height="66" fill="none" stroke="#8b2b2b" stroke-width="1.5"/>
    <g font-family="'Courier New', Courier, monospace" font-size="30" letter-spacing="5" fill="#8b2b2b" text-anchor="middle">
      <text x="1320" y="136">DO NOT FILE</text>
    </g>
    <g font-family="'Courier New', Courier, monospace" font-size="11" letter-spacing="3" fill="#8b2b2b" text-anchor="middle">
      <text x="1320" y="154">RETURN TO SHELF 0</text>
    </g>
  </g>

  <!-- handwriting -->
  <g transform="rotate(-2.5 1180 340)" opacity="0.8">
    <text x="1010" y="352" font-family="'Segoe Script','Bradley Hand','URW Chancery L','Comic Sans MS',cursive" font-size="27" fill="#2f3a55">it knows you opened it</text>
    <path d="M1008 358 C1080 366 1170 364 1236 356" stroke="#2f3a55" stroke-width="1.2" fill="none" opacity="0.6"/>
  </g>

  <!-- photocopy wear -->
  <g opacity="0.35">
    <rect x="0" y="0" width="1600" height="400" fill="url(#edge)"/>
    <rect x="0" y="0" width="1600" height="400" fill="url(#edgex)"/>
  </g>
  <rect x="6" y="6" width="1588" height="388" fill="none" stroke="#8d7c58" stroke-width="1" opacity="0.35"/>
</svg>
