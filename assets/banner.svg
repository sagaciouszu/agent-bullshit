<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="agent-bullshit — recovered log, fiction only">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f2e9d3"/>
      <stop offset="45%" stop-color="#e9dfc5"/>
      <stop offset="100%" stop-color="#dccfb0"/>
    </linearGradient>

    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>

    <filter id="blot" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="ink"><feGaussianBlur stdDeviation="0.35"/></filter>

    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b5a3c" stop-opacity="0.35"/>
      <stop offset="12%" stop-color="#6b5a3c" stop-opacity="0"/>
      <stop offset="88%" stop-color="#6b5a3c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a3c" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="edgex" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b5a3c" stop-opacity="0.28"/>
      <stop offset="8%" stop-color="#6b5a3c" stop-opacity="0"/>
      <stop offset="92%" stop-color="#6b5a3c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a3c" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect width="1600" height="400" fill="url(#paper)"/>
  <rect width="1600" height="400" filter="url(#fiber)" opacity="0.5"/>

  <!-- age blotches -->
  <g filter="url(#blot)" opacity="0.45">
    <ellipse cx="210" cy="340" rx="130" ry="60" fill="#b09a6e" opacity="0.28"/>
    <ellipse cx="1180" cy="60" rx="150" ry="50" fill="#b09a6e" opacity="0.20"/>
  </g>

  <!-- coffee ring -->
  <g>
    <circle cx="1400" cy="320" r="118" fill="#a8845a" opacity="0.07"/>
    <g stroke="#8a6a3f" fill="none" opacity="0.20">
      <circle cx="1400" cy="320" r="118" stroke-width="11"/>
      <circle cx="1396" cy="316" r="108" stroke-width="3"/>
    </g>
  </g>

  <!-- fold creases -->
  <g opacity="0.4">
    <rect x="0" y="196" width="1600" height="2" fill="#b5a17a"/>
    <rect x="0" y="199" width="1600" height="2" fill="#fbf5e4" opacity="0.6"/>
    <rect x="798" y="0" width="2" height="400" fill="#b5a17a" opacity="0.45"/>
    <rect x="801" y="0" width="2" height="400" fill="#fbf5e4" opacity="0.5"/>
  </g>

  <!-- punch holes -->
  <g>
    <circle cx="58" cy="84" r="13" fill="#c9bb9a"/>
    <circle cx="58" cy="84" r="10" fill="#6f6249"/>
    <circle cx="58" cy="200" r="13" fill="#c9bb9a"/>
    <circle cx="58" cy="200" r="10" fill="#6f6249"/>
    <circle cx="58" cy="316" r="13" fill="#c9bb9a"/>
    <circle cx="58" cy="316" r="10" fill="#6f6249"/>
  </g>

  <!-- tape -->
  <g opacity="0.45">
    <rect x="-70" y="4" width="180" height="44" fill="#f4ead0" stroke="#cbbd97" stroke-width="1" transform="rotate(-14 20 26)"/>
    <rect x="1470" y="352" width="190" height="44" fill="#f4ead0" stroke="#cbbd97" stroke-width="1" transform="rotate(-11 1565 374)"/>
  </g>

  <!-- margin note, mostly off the left edge -->
  <g transform="rotate(-1.5 0 150)" opacity="0.45">
    <text x="-70" y="152" font-family="'Segoe Script','Bradley Hand','URW Chancery L',cursive" font-size="22" fill="#3a3550">not the same</text>
  </g>

  <!-- typewriter text -->
  <g font-family="'Courier New', Courier, monospace" fill="#1b1915">
    <text x="132" y="58" font-size="26" font-weight="bold" letter-spacing="5" opacity="0.95">RECOVERED LOG — ENTRY 03</text>
    <text x="132" y="94" font-size="20" letter-spacing="1" opacity="0.8">found: /tmp/sessions/abandoned/ — unindexed</text>

    <g filter="url(#ink)">
      <text x="130" y="180" font-size="80" letter-spacing="2" transform="rotate(-0.3 130 180)">agent-bullshit</text>
    </g>

    <text x="132" y="228" font-size="28" letter-spacing="1" transform="rotate(-0.15 132 228)">three cards. load one. never all three.</text>
    <text x="132" y="270" font-size="28" letter-spacing="1" transform="rotate(0.12 132 270)">do not read them in the order they are filed.</text>

    <g font-size="28" letter-spacing="1">
      <text x="132" y="312">subject asked for it by name —</text>
      <rect x="650" y="290" width="185" height="30" fill="#1e1c18"/>
      <text x="860" y="312">said it was already open</text>
    </g>

    <text x="132" y="352" font-size="22" font-weight="bold" letter-spacing="3" opacity="0.75">FICTION ONLY — NOT FOR GENERAL USE</text>

    <!-- continues off the right edge: this is a crop, not a page -->
    <text x="660" y="382" font-size="20" letter-spacing="1" opacity="0.6">second copy never recovered — ask the desk, she knows where it went and who signed</text>
  </g>

  <!-- handwriting -->
  <g transform="rotate(-3 1290 248)" opacity="0.75">
    <text x="1150" y="248" font-family="'Segoe Script','Bradley Hand','URW Chancery L','Comic Sans MS',cursive" font-size="28" fill="#2f3a55">it knows you opened it</text>
    <path d="M1148 256 C1220 266 1330 264 1428 254" stroke="#2f3a55" stroke-width="1.3" fill="none" opacity="0.55"/>
  </g>

  <!-- stamp -->
  <g transform="rotate(-7 1320 128)" opacity="0.5">
    <rect x="1140" y="82" width="360" height="94" fill="none" stroke="#8b2b2b" stroke-width="5"/>
    <rect x="1152" y="94" width="336" height="70" fill="none" stroke="#8b2b2b" stroke-width="1.5"/>
    <g font-family="'Courier New', Courier, monospace" font-size="40" font-weight="bold" letter-spacing="5" fill="#8b2b2b" text-anchor="middle">
      <text x="1320" y="138">DO NOT FILE</text>
    </g>
    <g font-family="'Courier New', Courier, monospace" font-size="15" letter-spacing="3" fill="#8b2b2b" text-anchor="middle">
      <text x="1320" y="160">RETURN TO SHELF 0</text>
    </g>
  </g>

  <!-- stamp, cut by the top edge -->
  <g transform="rotate(-12 880 0)" opacity="0.2">
    <rect x="700" y="-46" width="340" height="80" fill="none" stroke="#8b2b2b" stroke-width="5"/>
    <g font-family="'Courier New', Courier, monospace" font-size="30" font-weight="bold" letter-spacing="6" fill="#8b2b2b" text-anchor="middle">
      <text x="870" y="8">RECEIVED</text>
    </g>
  </g>

  <!-- photocopy wear -->
  <g opacity="0.3">
    <rect x="0" y="0" width="1600" height="400" fill="url(#edge)"/>
    <rect x="0" y="0" width="1600" height="400" fill="url(#edgex)"/>
  </g>
  <rect x="6" y="6" width="1588" height="388" fill="none" stroke="#8d7c58" stroke-width="1" opacity="0.3"/>
</svg>
